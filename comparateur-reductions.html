<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur de réductions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF9F5;
    --ink: #1C2A21;
    --gold: #B8902E;
    --sage: #5E7A63;
    --hairline: #DAD5C4;
    --white: #FFFFFF;
    --tag-direct-bg: #EFEAE0;
    --tag-cadeau-bg: #E7EEE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  header { margin-bottom: 32px; }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 6vw, 44px);
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--sage); font-size: 15px; margin: 0; }
  .search-box { margin-bottom: 28px; }
  input[type="search"] {
    width: 100%;
    padding: 16px 18px;
    font-size: 17px;
    font-family: inherit;
    border: 1.5px solid var(--hairline);
    border-radius: 10px;
    background: var(--white);
    color: var(--ink);
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--gold); }
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--sage);
    margin-bottom: 16px;
    padding: 0 2px;
  }
  ul.results { list-style: none; margin: 0; padding: 0; }
  li.merchant {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  li.merchant.top { border: 1.5px solid var(--gold); }
  .merchant-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .name { font-size: 16px; font-weight: 500; }
  .badge {
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 2px;
  }
  .offer-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .offer-col {
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 44px;
  }
  .offer-col.direct { background: var(--tag-direct-bg); }
  .offer-col.carte_cadeau { background: var(--tag-cadeau-bg); }
  .offer-col-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }
  .offer-col.direct .offer-col-label { color: #7A6A3E; }
  .offer-col.carte_cadeau .offer-col-label { color: var(--sage); }
  .offer-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    padding: 3px 0;
  }
  .offer-line .platform { color: var(--ink); opacity: 0.75; }
  .offer-line .offer-percent { font-weight: 600; font-size: 15px; }
  .offer-col-empty {
    font-size: 12px;
    color: var(--sage);
    opacity: 0.6;
    font-style: italic;
  }
  @media (max-width: 420px) {
    .offer-columns { grid-template-columns: 1fr; }
  }
  .cumul-note {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--hairline);
    font-size: 13px;
    color: var(--sage);
  }
  .cumul-note strong { color: var(--ink); }
  .cumul-note.cumul-warning { color: #96632B; }
  .rank-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    margin-top: 10px;
    padding: 8px 0 0;
    border: none;
    border-top: 1px dashed var(--hairline);
    background: none;
    color: var(--sage);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
  }
  .rank-toggle:hover { color: var(--ink); }
  .rank-toggle .chevron {
    display: inline-block;
    transition: transform 0.15s ease;
    font-size: 10px;
  }
  .rank-toggle.open .chevron { transform: rotate(180deg); }
  .rank-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rank-row {
    display: grid;
    grid-template-columns: 20px 1fr auto auto;
    align-items: baseline;
    gap: 10px;
    padding: 5px 6px;
    border-radius: 6px;
    font-size: 13px;
  }
  .rank-row:nth-child(odd) { background: #F3F1EA; }
  .rank-row .rank-num {
    color: var(--sage);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .rank-row .rank-platform { color: var(--ink); }
  .rank-row .rank-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--sage);
    opacity: 0.85;
    white-space: nowrap;
  }
  .rank-row .rank-value {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .rank-row.rank-best { background: var(--tag-cadeau-bg); }
  .rank-row.rank-best .rank-value { color: var(--gold); }
  .empty, .status {
    text-align: center;
    color: var(--sage);
    padding: 40px 0;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Où profiter de la meilleure réduction ?</h1>
      <p class="sub">Cherchez un magasin, on compare pour vous.</p>
    </header>

    <div class="search-box">
      <input type="search" id="search" placeholder="Nom du magasin (ex. Carrefour, Fnac...)" autocomplete="off">
    </div>

    <div class="meta-row">
      <span id="count-label"></span>
      <span id="updated-label"></span>
    </div>

    <div id="status" class="status">Chargement des données…</div>
    <ul class="results" id="results"></ul>
  </div>

<script>
  // Liste des fichiers de données à charger et fusionner. Chaque fichier peut
  // suivre soit le schéma imbriqué "merchants" (ex. fnac_darty.json), soit le
  // schéma plat "offers" (ex. igraal.json, ulys_offers.json, thecorner_offers.json,
  // happypal_offers.json). Ajouter un nom de fichier ici suffit à l'intégrer au
  // comparateur et au classement multi-plateformes par magasin.
  const DATA_FILES = [
    'fnac_darty.json',
    'igraal.json',
    'ebuyclub.json',
    'banque_populaire.json',
    'thecorner_offers.json',
    'ulys_offers.json',
    'happypal_offers.json',
  ];

  let merchants = [];

  function normalize(str) {
    return str.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  const TYPE_LABELS = {
    direct: 'Réduction directe',
    carte_cadeau: 'Carte cadeau',
  };

  // --- Normalisation des différents schémas de données vers une forme commune ---

  // Schéma imbriqué (fnac_darty.json) : { merchants: [{ name, offers, best_percent, best_type, cumulable_total }] }
  function nestedFileToMerchants(data) {
    return (data.merchants || []).map(m => ({
      name: m.name,
      offers: (m.offers || []).map(o => ({
        platform: o.platform,
        type: o.type,
        percent: typeof o.percent === 'number' ? o.percent : null,
        rate_text: null,
      })),
      _singleSourceBestPercent: m.best_percent,
      _singleSourceBestType: m.best_type,
      _singleSourceCumulableTotal: m.cumulable_total,
    }));
  }

  // Schéma plat (igraal.json, ulys_offers.json, thecorner_offers.json, happypal.json...) :
  // { platform: "...", offers: [{ name, type, percent, rate_text }] }
  function flatFileToMerchants(data) {
    const byName = new Map();
    (data.offers || []).forEach(o => {
      const key = normalize(o.name || '').trim();
      if (!key) return;
      if (!byName.has(key)) byName.set(key, { name: o.name, offers: [] });
      byName.get(key).offers.push({
        platform: data.platform,
        type: o.type,
        percent: typeof o.percent === 'number' ? o.percent : null,
        rate_text: o.rate_text || null,
      });
    });
    return Array.from(byName.values());
  }

  function normalizeDataset(data) {
    if (!data) return [];
    if (Array.isArray(data.merchants)) return nestedFileToMerchants(data);
    if (Array.isArray(data.offers)) return flatFileToMerchants(data);
    return [];
  }

  // Fusionne les listes de marchands (une par fichier chargé) en une seule liste,
  // en regroupant par nom (normalisé) et en combinant toutes leurs offres —
  // c'est cette fusion qui permet le classement multi-plateformes par magasin.
  function mergeMerchantLists(lists) {
    const byKey = new Map();
    lists.flat().forEach(m => {
      const key = normalize(m.name).trim();
      if (!key) return;
      if (!byKey.has(key)) {
        byKey.set(key, { name: m.name, offers: [], _sourceCount: 0, _singleSource: null });
      }
      const entry = byKey.get(key);
      entry.offers.push(...m.offers);
      entry._sourceCount += 1;
      if (m._singleSourceBestPercent !== undefined) entry._singleSource = m;
    });

    return Array.from(byKey.values()).map(entry => {
      let best_percent, best_type, cumulable_total;
      if (entry._sourceCount === 1 && entry._singleSource) {
        // Un seul fichier a fourni ce marchand : on garde exactement les
        // valeurs déjà calculées par ce fichier (comportement inchangé).
        best_percent = entry._singleSource._singleSourceBestPercent;
        best_type = entry._singleSource._singleSourceBestType;
        cumulable_total = entry._singleSource._singleSourceCumulableTotal;
      } else {
        // Fusion de plusieurs sources : on recalcule le meilleur taux connu.
        // Le cumul entre plateformes différentes n'étant jamais garanti,
        // cumulable_total reste vide (l'avertissement cumul s'en charge).
        const withPercent = entry.offers
          .filter(o => typeof o.percent === 'number')
          .sort((a, b) => b.percent - a.percent);
        best_percent = withPercent.length ? withPercent[0].percent : 0;
        best_type = withPercent.length ? withPercent[0].type : null;
        cumulable_total = null;
      }
      return { name: entry.name, offers: entry.offers, best_percent, best_type, cumulable_total };
    });
  }

  function offerLine(offer) {
    return `
      <div class="offer-line">
        <span class="platform">${offer.platform}</span>
        <span class="offer-percent">${offer.percent}%</span>
      </div>
    `;
  }

  function offerColumn(type, offers) {
    const sorted = offers.slice().sort((a, b) => b.percent - a.percent);
    const content = sorted.length
      ? sorted.map(offerLine).join('')
      : `<div class="offer-col-empty">Aucune offre</div>`;
    return `
      <div class="offer-col ${type}">
        <span class="offer-col-label">${TYPE_LABELS[type]}</span>
        ${content}
      </div>
    `;
  }

  // Classement unique, toutes plateformes et tous types (directe + carte
  // cadeau) confondus, du meilleur au moins bon — c'est la liste qui s'ouvre
  // au clic sur "Classement complet" pour un magasin donné.
  function rankedOfferRows(offers) {
    const withPercent = offers
      .filter(o => typeof o.percent === 'number')
      .sort((a, b) => b.percent - a.percent);
    const withoutPercent = offers.filter(o => typeof o.percent !== 'number');
    const ranked = withPercent.concat(withoutPercent);

    return ranked.map((o, i) => {
      const value = typeof o.percent === 'number'
        ? `${o.percent}%`
        : (o.rate_text || 'Voir l’offre');
      return `
        <div class="rank-row ${i === 0 && typeof o.percent === 'number' ? 'rank-best' : ''}">
          <span class="rank-num">${i + 1}</span>
          <span class="rank-platform">${o.platform}</span>
          <span class="rank-type">${TYPE_LABELS[o.type] || o.type || ''}</span>
          <span class="rank-value">${value}</span>
        </div>
      `;
    }).join('');
  }

  function merchantCard(m, isTop, idx) {
    const direct = m.offers.filter(o => o.type === 'direct');
    const carteCadeau = m.offers.filter(o => o.type === 'carte_cadeau');
    const offersHtml = `
      <div class="offer-columns">
        ${offerColumn('direct', direct)}
        ${offerColumn('carte_cadeau', carteCadeau)}
      </div>
    `;

    const platforms = new Set(m.offers.map(o => o.platform));
    let cumulNote = '';
    if (platforms.size > 1) {
      // Plusieurs plateformes différentes : le cumul entre elles n'est
      // jamais garanti par les données, quelle que soit l'offre.
      cumulNote = `<div class="cumul-note cumul-warning">⚠️ Ces offres viennent de plateformes différentes : rien ne garantit qu'elles se cumulent. À vérifier vous-même avant achat.</div>`;
    } else if (m.cumulable_total) {
      cumulNote = `<div class="cumul-note">Cumulables : <strong>jusqu'à ${m.cumulable_total}%</strong> en combinant les deux</div>`;
    } else if (m.offers.length > 1) {
      cumulNote = `<div class="cumul-note cumul-warning">⚠️ Rien n'indique que ces deux offres se cumulent. À vérifier vous-même avant achat.</div>`;
    }

    const rankId = `rank-${idx}`;
    const rankToggle = m.offers.length > 1 ? `
      <button type="button" class="rank-toggle" data-target="${rankId}" aria-expanded="false">
        <span class="chevron">▾</span>
        <span class="rank-toggle-label">Classement complet (${m.offers.length} offres, toutes plateformes)</span>
      </button>
      <div class="rank-list" id="${rankId}" hidden>
        ${rankedOfferRows(m.offers)}
      </div>
    ` : '';

    return `
      <li class="merchant ${isTop ? 'top' : ''}">
        <div class="merchant-head">
          <div>
            ${isTop ? '<span class="badge">Meilleure offre</span>' : ''}
            <div class="name">${m.name}</div>
          </div>
        </div>
        ${offersHtml}
        ${cumulNote}
        ${rankToggle}
      </li>
    `;
  }

  function render(query) {
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    resultsEl.innerHTML = '';

    const q = normalize(query.trim());
    if (!q) {
      statusEl.textContent = 'Tapez le nom d’un magasin pour voir les offres.';
      statusEl.style.display = 'block';
      return;
    }

    const matches = merchants
      .filter(m => normalize(m.name).includes(q))
      .sort((a, b) => b.best_percent - a.best_percent);

    if (matches.length === 0) {
      statusEl.textContent = 'Aucune offre trouvée pour ce magasin.';
      statusEl.style.display = 'block';
      return;
    }

    statusEl.style.display = 'none';
    matches.slice(0, 15).forEach((m, i) => {
      resultsEl.insertAdjacentHTML('beforeend', merchantCard(m, i === 0, i));
    });
  }

  // Ouvre/ferme le classement complet d'un magasin au clic (délégation
  // d'événement car les cartes sont régénérées à chaque recherche).
  document.getElementById('results').addEventListener('click', e => {
    const btn = e.target.closest('.rank-toggle');
    if (!btn) return;
    const list = document.getElementById(btn.dataset.target);
    if (!list) return;
    const isHidden = list.hasAttribute('hidden');
    if (isHidden) {
      list.removeAttribute('hidden');
      btn.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    } else {
      list.setAttribute('hidden', '');
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });

  Promise.all(
    DATA_FILES.map(file =>
      fetch(file)
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null)
    )
  ).then(datasets => {
    const loaded = datasets.filter(Boolean);
    if (loaded.length === 0) {
      document.getElementById('status').textContent =
        'Impossible de charger les données (aucun fichier trouvé ou invalide).';
      return;
    }

    merchants = mergeMerchantLists(loaded.map(normalizeDataset));

    document.getElementById('count-label').textContent =
      `${merchants.length} marchands avec offre active`;

    const dates = loaded
      .map(d => d.fetched_at || d.captured_at)
      .filter(Boolean)
      .map(d => new Date(d))
      .filter(d => !isNaN(d));
    if (dates.length) {
      const mostRecent = new Date(Math.max(...dates.map(d => d.getTime())));
      document.getElementById('updated-label').textContent =
        'Mis à jour le ' + mostRecent.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
    }

    render('');
  });

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
</script>
</body>
</html>
