name: Mise à jour quotidienne des taux (toutes plateformes publiques)

on:
  schedule:
    # Tous les jours à 6h00 UTC (7h ou 8h heure française selon la saison)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Permet aussi de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fnac Darty Pass
        run: python fetch_fnac_darty.py
        continue-on-error: true

      - name: eBuyClub
        run: python fetch_ebuyclub.py
        continue-on-error: true

      - name: iGraal
        run: python fetch_igraal.py
        continue-on-error: true

      - name: Banque Populaire (Extra+X)
        run: python fetch_banque_populaire.py
        continue-on-error: true

      - name: iGraal Bon d'achat
        run: python fetch_igraal_bon_achat.py
        continue-on-error: true

      - name: Enregistrer les nouvelles données si elles ont changé
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnac_darty.json ebuyclub.json igraal.json banque_populaire.json igraal_bon_achat.json
          git diff --staged --quiet && echo "Aucun changement" || git commit -m "Mise à jour automatique des taux"
          git push
