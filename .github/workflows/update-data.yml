name: Mise à jour quotidienne des taux (toutes plateformes publiques)

on:
  schedule:
    # Tous les jours a 23h00 UTC, soit 1h00 du matin heure francaise en ete (CEST, UTC+2).
    # Objectif : capturer la Selection du jour iGraal (offres boostees, qui changent a minuit)
    # le plus tot possible apres le changement, plutot qu'a 6h ou une bonne partie de la
    # journee etait deja passee. Attention : cron GitHub Actions ne s'ajuste pas seul au
    # changement d'heure - en heure d'hiver (CET, UTC+1) ce run tombera a minuit pile (0h00)
    # au lieu de 1h00 ; a corriger manuellement (cron '0 23 * * *' -> '0 0 * * *') si besoin
    # de garder l'horaire local stable apres le passage a l'heure d'hiver fin octobre.
    - cron: '0 23 * * *'
  workflow_dispatch:
    # Permet aussi de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fnac Darty Pass
        run: python fetch_fnac_darty.py
        continue-on-error: true

      - name: eBuyClub
        run: python fetch_ebuyclub.py
        continue-on-error: true

      - name: iGraal
        run: python fetch_igraal.py
        continue-on-error: true

      - name: Banque Populaire (Extra+X)
        run: python fetch_banque_populaire.py
        continue-on-error: true

      - name: iGraal Bon d'achat
        run: python fetch_igraal_bon_achat.py
        continue-on-error: true

      - name: iGraal Sélection du jour (offres boostées)
        run: python fetch_igraal_selection.py
        continue-on-error: true

      - name: Enregistrer les nouvelles données si elles ont changé
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnac_darty.json ebuyclub.json igraal.json banque_populaire.json igraal_bon_achat.json igraal_selection_du_jour.json
          git diff --staged --quiet && echo "Aucun changement" || git commit -m "Mise à jour automatique des taux"
          git push
